# Ablation Study - Learning Rate Sweep
# Baseline: tiny, gating_type=none, pos_emb_type=learned, cond_type=adaln_zero
# Varying: Learning rate only

program: train.py
method: grid
metric:
  name: val/loss
  goal: minimize
command:
  - ${env}
  - python
  - ${program}
  - "--use_wandb"
  - ${args}

parameters:
  # Fixed baseline parameters
  wandb_project:
    value: "word-diffusion"
  model_size:
    value: "tiny"
  data_path:
    value: "../data/words_dictionary_no_plural.parquet"
  batch_size:
    value: 256
  ema_rate:
    value: 0.997
  epochs:
    value: 10
  warmup_steps:
    value: 800
  timesteps:
    value: 400
  model_type:
    value: "genmd4"
  schedule:
    value: "linear"
  optimizer:
    value: "muon"
  gating_type:
    value: "none"
  pos_emb_type:
    value: "learned"
  cond_type:
    value: "in_context_4"
  
  # Learning rate ablation
  lr:
    value: 3e-3
  
  # Enable torch.compile for faster training
  compile:
    value: true
  
  use_amp:
    values: [True, False]
  
  # Random seeds for multiple replications (3 runs per config)
  seed:
    values: [42, 123, 456, 789, 1001]