# Nginx configuration for Word Diffusion website
# Place this in /etc/nginx/sites-available/word-diffusion
# Then symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your domain or use localhost
    server_name localhost;
    
    # Path to the built static files
    root /path/to/website/build;
    index index.html;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/octet-stream;  # For .onnx files
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CORS headers (if needed for loading from CDN)
    add_header Access-Control-Allow-Origin "*" always;
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # ONNX model files - cache aggressively
    location ~* \.onnx$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/octet-stream";
    }
    
    # JSON files (config, tokenizer)
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Type "application/json";
    }
    
    # HTML files - no cache for updates
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    
    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Optional: Enable HTTP/2
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
}
